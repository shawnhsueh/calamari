[project]
name = "calamari"
version = "0.1.0"
description = "Calamari price index for Vancouver restaurants"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "selectolax>=1.0",
    "pypdf>=4.2",
    "fonttools>=4.50",  # lets pypdf decode CFF/Type1 fonts in PDF menus
    "python-dotenv>=1.0",
    "tenacity>=8.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pipeline"]
